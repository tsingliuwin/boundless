# Boundless — automated release builds for Windows + macOS.
#
# Setup:
#   1. Create a GitHub repo (mirror of your Gitee repo).
#   2. git remote add github <your-github-url>
#   3. git push github main
#   4. git tag v0.1.0 && git push github v0.1.0
#   5. Actions auto-build → zip artifacts appear on the Releases page.
#
# The workflow triggers on any tag matching `v*`. It builds release binaries
# for Windows (x86_64) and macOS (Apple Silicon ARM64), packages each as a
# zip, and publishes a GitHub Release with both attached.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed by softprops/action-gh-release

jobs:
  # ------------------------------------------------------------------
  # Build matrix: one job per platform.
  # ------------------------------------------------------------------
  build:
    strategy:
      fail-fast: false # let the other platform finish even if one fails
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: boundless.exe
            archive: boundless-${{ github.ref_name }}-win-x64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: boundless
            archive: boundless-${{ github.ref_name }}-macos-arm64.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # Must match the cache-warmer workflow's shared-key exactly so
          # tag builds hit the pre-warmed dependency cache.
          shared-key: "boundless-${{ matrix.target }}"
          save-if: "true"
          cache-on-failure: "true"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path target/${{ matrix.target }}/release/${{ matrix.artifact }} `
            -DestinationPath ${{ matrix.archive }}

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          # Assemble a proper .app bundle so Finder/Dock show the real icon
          # and the app is launchable by double-clicking, not just a bare
          # binary. ditto preserves unix permissions/extended attributes that
          # plain `zip` would drop (important for a runnable .app).
          set -euo pipefail
          APP="Boundless.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "$APP/Contents/MacOS/boundless"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          cp assets/Info.plist "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/boundless"
          # Substitute the version from the git tag (vX.Y.Z -> X.Y.Z).
          VERSION="${GITHUB_REF_NAME#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$APP/Contents/Info.plist"
          ditto -c -k --keepParent "$APP" "${{ matrix.archive }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  # ------------------------------------------------------------------
  # Publish a GitHub Release with both zips attached.
  # ------------------------------------------------------------------
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog generation

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          # Commits since the previous tag (or all if this is the first tag).
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            git log --oneline --no-merges "$PREV_TAG"..HEAD >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "body<<EOF" >> "$GITHUB_OUTPUT"
            git log --oneline --no-merges HEAD >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
