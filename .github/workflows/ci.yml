# CI: unit tests + dependency cache warming.
#
# Jobs:
#   test  - `cargo test` on Windows (the dev platform). Every push to main,
#           all PRs. Catches regressions in the unit-tested modules (scene,
#           ink, render, camera, history, ai, updater) before they land.
#   warm  - pre-compiles release-mode dependencies on main so that
#           tag-triggered Release builds (release.yml) hit the cache and only
#           recompile the app crate + link.
#
# Triggers:
#   - push to main (test always; warm only when Cargo.lock changes)
#   - pull requests (test only)
#   - manual (workflow_dispatch)
# Warm skips "chore: bump version" commits (those trigger the full Release
# build simultaneously - no point warming in parallel).

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # Distinct key: debug test artifacts must not poison the release
          # cache shared with release.yml.
          shared-key: "boundless-test-x86_64-pc-windows-msvc"
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: "true"

      - name: Run unit tests
        run: cargo test

  warm:
    needs: test
    # Block scalar on purpose: the expression contains "chore: " whose colon
    # would terminate a plain (unquoted) YAML scalar. All continuation lines
    # share the same indent so the folded value is a single clean line.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit != null &&
      !startsWith(github.event.head_commit.message, 'chore: bump version') &&
      contains(format('{0}{1}{2}', join(github.event.head_commit.added, ' '), join(github.event.head_commit.modified, ' '), join(github.event.head_commit.removed, ' ')), 'Cargo.lock'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # Must match release.yml's shared-key exactly for cross-workflow hits.
          shared-key: "boundless-${{ matrix.target }}"
          save-if: "true"
          cache-on-failure: "true"

      - name: Compile release dependencies
        run: cargo build --release --target ${{ matrix.target }}
