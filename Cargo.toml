[package]
name = "boundless"
version = "0.2.9"
edition = "2021"
description = "A boundless Excalidraw-style whiteboard built on GPUI, with a rig-powered AI agent that draws directly onto the canvas"

[dependencies]
gpui = "0.2.2"
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rough_piet = "0.13"
roughr = "0.12"
euclid = "0.22"
kurbo = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
futures-util = "0.3"
dirs = "6"
rfd = "0.15"
# GPUI component library (Input, Button, etc.). The crates.io 0.5 release
# depends on gpui ^0.2.2 - the same version this project uses - so no GPUI
# source change is needed.
gpui-component = "0.5"
# Embedded SVG icon assets for gpui-component's IconName enum. The git tag
# matches the crates.io release; the crate itself only depends on gpui's
# AssetSource trait and embeds icons via rust_embed.
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", tag = "v0.5.1" }
# rig drives the AI agent: an OpenAI-compatible client, multi-turn tool-calling
# loop, and streaming. The `derive` feature pulls in `rig-derive` (and schemars)
# so tool argument types can derive their JSON schema.
rig-core = { version = "0.38", default-features = false, features = [
    "derive",
    "reqwest",
    "rustls",
] }
# JSON-Schema derive for rig tool argument structs (reuses the schemars in the
# dependency graph that rig-core already pulls in).
schemars = "1"

# --- Auto-update --------------------------------------------------------------
# Self-hosted latest.json + CDN updater (lakemind-style, ported to GPUI).
# minisign-verify: verify downloaded artifacts against an embedded public key.
# semver: compare manifest version vs env!(CARGO_PKG_VERSION).
# zip: extract the Windows bare-exe artifact.
# flate2 + tar: extract the macOS .app.tar.gz bundle (preserves unix perms).
# semver/flate2 already exist transitively; listed directly for the updater.
minisign-verify = "0.2"
semver = "1"
zip = "2"
flate2 = "1"
tar = "0.4"

# Win32 interop: GPUI updates the *cached* cursor style on a modifier change,
# but on Windows the system cursor only refreshes on WM_SETCURSOR (mouse move).
# We set the system cursor directly so holding Ctrl/Shift changes it instantly.
# Target-gated; no-op on other platforms.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # Pen pressure: SetWindowSubclass/DefSubclassProc (Shell) and
    # GetPointerInfo/GetPointerPenInfo (Input_Pointer) for the WM_POINTER
    # hook that feeds stylus pressure into the ink pipeline.
    "Win32_UI_Shell",
    "Win32_UI_Input_Pointer",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_Foundation",
] }
# raw-window-handle is already in the dep graph (transitively via gpui); we add
# it directly to obtain the HWND for `platform::toggle_maximize` (GPUI's
# `zoom_window` only maximizes on Windows - it doesn't toggle, so restore needs
# a direct `ShowWindow(SW_RESTORE)` via the window handle).
raw-window-handle = "0.6"

# macOS interop: set the Dock/application icon at runtime via
# `[NSApp setApplicationIconImage:]`. Pinned to the version already in
# Cargo.lock (pulled in transitively by GPUI) so no new dependency enters the
# graph. Target-gated; no-op on other platforms.
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

# Windows application icon embedding (see build.rs). Pinned to the version that
# already exists in Cargo.lock so we don't introduce a new dependency.
[build-dependencies]
embed-resource = "=3.0.11"

[lints.rust]
# objc 0.2's macros emit internal `cfg(feature = "cargo-clippy")` checks that
# trip `unexpected_cfgs` in downstream crates. The crate is unmaintained
# (objc2 is its successor), so allow the lint app-wide. boundless has no custom
# cfgs of its own, so this only silences the upstream macro noise.
unexpected_cfgs = { level = "allow" }

[profile.dev]
# GPUI is large; keep local codegen fast while iterating.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
# Fast-to-build release profile (adapted from lakemind):
#   thin LTO: most optimization benefit, far faster link than fat LTO.
#   strip: drops debug symbols -> faster link + smaller binary.
#   panic = abort: removes unwinding machinery -> less codegen.
#   codegen-units = 16: max parallelism for compile speed.
opt-level = 3
codegen-units = 16
lto = "thin"
panic = "abort"
strip = true

[dev-dependencies]
# Full minisign crate (generate keypair + sign), used only by the
# examples/gen_minisign_keypair.rs and examples/sign_release.rs helpers (local
# keygen + CI signing). The app itself verifies with the lighter
# `minisign-verify` (a normal dep above). Dev-only so it never ships in a
# release binary.
minisign = "0.9.1"
