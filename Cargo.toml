[package]
name = "boundless"
version = "0.1.0"
edition = "2021"
description = "A boundless Excalidraw-style whiteboard built on GPUI, with a rig-powered AI agent that draws directly onto the canvas"

[dependencies]
gpui = "0.2.2"
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rough_piet = "0.13"
roughr = "0.12"
euclid = "0.22"
kurbo = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
tokio = { version = "1", features = ["rt-multi-thread"] }
futures = "0.3"
futures-util = "0.3"
dirs = "6"
rfd = "0.15"
# rig drives the AI agent: an OpenAI-compatible client, multi-turn tool-calling
# loop, and streaming. The `derive` feature pulls in `rig-derive` (and schemars)
# so tool argument types can derive their JSON schema.
rig-core = { version = "0.38", default-features = false, features = [
    "derive",
    "reqwest",
    "rustls",
] }
# JSON-Schema derive for rig tool argument structs (reuses the schemars in the
# dependency graph that rig-core already pulls in).
schemars = "1"

# Win32 interop: GPUI updates the *cached* cursor style on a modifier change,
# but on Windows the system cursor only refreshes on WM_SETCURSOR (mouse move).
# We set the system cursor directly so holding Ctrl/Shift changes it instantly.
# Target-gated; no-op on other platforms.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_WindowsAndMessaging",
] }

# Windows application icon embedding (see build.rs). Pinned to the version that
# already exists in Cargo.lock so we don't introduce a new dependency.
[build-dependencies]
embed-resource = "=3.0.11"

[profile.dev]
# GPUI is large; keep local codegen fast while iterating.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
